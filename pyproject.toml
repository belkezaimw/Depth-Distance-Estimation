[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfire-estimator"
version = "1.0.0"
description = "Distance estimation from fixed surveillance camera images using AI depth + DEM terrain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DFire Team" }]

keywords = ["wildfire", "distance", "estimation", "depth", "DEM", "SRTM", "computer-vision"]

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "Pillow>=9.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "timm>=0.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
dfire = "dfire.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dfire*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true